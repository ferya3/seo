# Local platform. Everything in the "Shared Services" row of the architecture,
# plus the services that exist today.
#
#   docker compose -f infra/docker/docker-compose.yml up -d
#
# Ports are published on 127.0.0.1 only — these are development backing
# services with default credentials and must not be reachable from outside.

name: seo-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: seo
      POSTGRES_DB: seo
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Applied in filename order on first boot of an empty volume.
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo -d seo"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: seo
      RABBITMQ_DEFAULT_PASS: seo
    ports:
      - "127.0.0.1:5672:5672"     # AMQP
      - "127.0.0.1:15672:15672"   # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"     # REST
      - "127.0.0.1:6334:6334"     # gRPC
    volumes:
      - qdrant-data:/qdrant/storage

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: devkey-change-me
      MEILI_ENV: development
    ports: ["127.0.0.1:7700:7700"]
    volumes:
      - meili-data:/meili_data

  minio:
    # Stands in for S3 / Cloudflare R2 locally, same API.
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: seo
      MINIO_ROOT_PASSWORD: seo-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  # ------------------------------------------------------------- our services

  crawl-api:
    build:
      context: ../..
      dockerfile: infra/docker/crawl.Dockerfile
    command: ["uvicorn", "services.crawl.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      CRAWL_DATA_DIR: /var/lib/seoagent/crawls
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
    ports: ["127.0.0.1:8001:8000"]
    volumes:
      - crawl-data:/var/lib/seoagent/crawls
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  crawl-worker:
    build:
      context: ../..
      dockerfile: infra/docker/crawl.Dockerfile
    command: ["python", "-m", "services.crawl.worker"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      CRAWL_DATA_DIR: /var/lib/seoagent/crawls
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
    volumes:
      # Only used if DATABASE_URL is removed: the file store is the fallback,
      # and it needs the API's directory to stay readable over HTTP.
      - crawl-data:/var/lib/seoagent/crawls
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: on-failure

  keyword-api:
    build:
      context: ../..
      dockerfile: infra/docker/keyword.Dockerfile
    command: ["uvicorn", "services.keyword.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      KEYWORD_DATA_DIR: /var/lib/seoagent/keywords
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
    ports: ["127.0.0.1:8002:8000"]
    volumes:
      - keyword-data:/var/lib/seoagent/keywords
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  keyword-worker:
    build:
      context: ../..
      dockerfile: infra/docker/keyword.Dockerfile
    command: ["python", "-m", "services.keyword.worker"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      KEYWORD_DATA_DIR: /var/lib/seoagent/keywords
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
    volumes:
      # Only used if DATABASE_URL is removed — see the crawl worker.
      - keyword-data:/var/lib/seoagent/keywords
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: on-failure

  serp-api:
    build:
      context: ../..
      dockerfile: infra/docker/serp.Dockerfile
    command: ["uvicorn", "services.serp.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      SERP_DATA_DIR: /var/lib/seoagent/serp
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
    ports: ["127.0.0.1:8004:8000"]
    volumes:
      - serp-data:/var/lib/seoagent/serp
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  serp-worker:
    build:
      context: ../..
      dockerfile: infra/docker/serp.Dockerfile
    command: ["python", "-m", "services.serp.worker"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      SERP_DATA_DIR: /var/lib/seoagent/serp
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
    volumes:
      - serp-data:/var/lib/seoagent/serp
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: on-failure

  links-api:
    build:
      context: ../..
      dockerfile: infra/docker/links.Dockerfile
    command: ["uvicorn", "services.internal_links.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      LINKS_DATA_DIR: /var/lib/seoagent/links
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
      # The one service-to-service call in the system: a crawl report is
      # megabytes, so it is fetched rather than put on the bus.
      CRAWL_SERVICE_URL: http://crawl-api:8000
    ports: ["127.0.0.1:8005:8000"]
    volumes:
      - links-data:/var/lib/seoagent/links
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
      crawl-api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  links-worker:
    build:
      context: ../..
      dockerfile: infra/docker/links.Dockerfile
    command: ["python", "-m", "services.internal_links.worker"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      LINKS_DATA_DIR: /var/lib/seoagent/links
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
      CRAWL_SERVICE_URL: http://crawl-api:8000
    volumes:
      - links-data:/var/lib/seoagent/links
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: on-failure

  content-api:
    build:
      context: ../..
      dockerfile: infra/docker/content.Dockerfile
    command: ["uvicorn", "services.content.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      CONTENT_DATA_DIR: /var/lib/seoagent/content
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
      # Two upstreams, because coverage is a question about both.
      CRAWL_SERVICE_URL: http://crawl-api:8000
      KEYWORD_SERVICE_URL: http://keyword-api:8000
    ports: ["127.0.0.1:8006:8000"]
    volumes:
      - content-data:/var/lib/seoagent/content
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  content-worker:
    build:
      context: ../..
      dockerfile: infra/docker/content.Dockerfile
    command: ["python", "-m", "services.content.worker"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      CONTENT_DATA_DIR: /var/lib/seoagent/content
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
      CRAWL_SERVICE_URL: http://crawl-api:8000
      KEYWORD_SERVICE_URL: http://keyword-api:8000
    volumes:
      - content-data:/var/lib/seoagent/content
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: on-failure

  competitor-api:
    build:
      context: ../..
      dockerfile: infra/docker/competitor.Dockerfile
    command: ["uvicorn", "services.competitor.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      COMPETITOR_DATA_DIR: /var/lib/seoagent/competitor
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
      # One upstream, used several times over: your crawl and each of theirs.
      CRAWL_SERVICE_URL: http://crawl-api:8000
    ports: ["127.0.0.1:8010:8000"]
    volumes:
      - competitor-data:/var/lib/seoagent/competitor
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  competitor-worker:
    build:
      context: ../..
      dockerfile: infra/docker/competitor.Dockerfile
    command: ["python", "-m", "services.competitor.worker"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      COMPETITOR_DATA_DIR: /var/lib/seoagent/competitor
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
      CRAWL_SERVICE_URL: http://crawl-api:8000
    volumes:
      - competitor-data:/var/lib/seoagent/competitor
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: on-failure

  optimizer-api:
    build:
      context: ../..
      dockerfile: infra/docker/optimizer.Dockerfile
    command: ["uvicorn", "services.optimizer.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      OPTIMIZER_DATA_DIR: /var/lib/seoagent/optimizer
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
      CRAWL_SERVICE_URL: http://crawl-api:8000
      KEYWORD_SERVICE_URL: http://keyword-api:8000
      # Optional. Without it the plan is a brief rather than written copy.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["127.0.0.1:8007:8000"]
    volumes:
      - optimizer-data:/var/lib/seoagent/optimizer
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  optimizer-worker:
    build:
      context: ../..
      dockerfile: infra/docker/optimizer.Dockerfile
    command: ["python", "-m", "services.optimizer.worker"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      OPTIMIZER_DATA_DIR: /var/lib/seoagent/optimizer
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
      CRAWL_SERVICE_URL: http://crawl-api:8000
      KEYWORD_SERVICE_URL: http://keyword-api:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - optimizer-data:/var/lib/seoagent/optimizer
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: on-failure

  reporting-api:
    build:
      context: ../..
      dockerfile: infra/docker/reporting.Dockerfile
    command: ["uvicorn", "services.reporting.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      REPORTING_DATA_DIR: /var/lib/seoagent/reports
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
      ORCHESTRATOR_URL: http://orchestrator-api:8000
    ports: ["127.0.0.1:8008:8000"]
    volumes:
      - reports-data:/var/lib/seoagent/reports
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  reporting-worker:
    build:
      context: ../..
      dockerfile: infra/docker/reporting.Dockerfile
    command: ["python", "-m", "services.reporting.worker"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      REPORTING_DATA_DIR: /var/lib/seoagent/reports
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
      ORCHESTRATOR_URL: http://orchestrator-api:8000
    volumes:
      - reports-data:/var/lib/seoagent/reports
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: on-failure

  notifications-api:
    build:
      context: ../..
      dockerfile: infra/docker/notifications.Dockerfile
    command: ["uvicorn", "services.notifications.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
      # Where a link in a notification should point: the gateway, because the
      # recipient is a person with a browser.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080/api}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-seo-agent@localhost}
    ports: ["127.0.0.1:8009:8000"]
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  notifications-worker:
    build:
      context: ../..
      dockerfile: infra/docker/notifications.Dockerfile
    command: ["python", "-m", "services.notifications.worker"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080/api}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-seo-agent@localhost}
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: on-failure

  orchestrator-api:
    build:
      context: ../..
      dockerfile: infra/docker/orchestrator.Dockerfile
    command: ["uvicorn", "agents.orchestrator.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
    ports: ["127.0.0.1:8003:8000"]
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  orchestrator-worker:
    # The only consumer of crawl.completed and keyword.researched. Without it
    # those events are published and nothing acts on them.
    build:
      context: ../..
      dockerfile: infra/docker/orchestrator.Dockerfile
    command: ["python", "-m", "agents.orchestrator.worker"]
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: on-failure

  api-gateway:
    # The only service exposed to the outside in a real deployment; everything
    # else here is reachable only on the compose network.
    build:
      context: ../..
      dockerfile: infra/docker/gateway.Dockerfile
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY:?run php artisan key:generate and export APP_KEY}
      DB_CONNECTION: pgsql
      DB_URL: postgresql://seo:seo@postgres:5432/seo
      CACHE_STORE: redis
      SESSION_DRIVER: array
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      CRAWL_SERVICE_URL: http://crawl-api:8000
      KEYWORD_SERVICE_URL: http://keyword-api:8000
      ORCHESTRATOR_URL: http://orchestrator-api:8000
      SERP_SERVICE_URL: http://serp-api:8000
      COMPETITOR_SERVICE_URL: http://competitor-api:8000
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: on-failure

  orchestrator-scheduler:
    build:
      context: ../..
      dockerfile: infra/docker/orchestrator.Dockerfile
    command: ["python", "-m", "agents.orchestrator.scheduler"]
    environment:
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
      SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-60}
    depends_on:
      postgres: {condition: service_healthy}
    # No RabbitMQ dependency on purpose: the scheduler stages events in the
    # outbox and the relay carries them, so a broker that is down delays
    # delivery instead of stopping schedules from firing.
    restart: on-failure

  outbox-relay:
    # The only process that publishes what the services staged. Exactly one
    # deployment needs it, but running two is safe (FOR UPDATE SKIP LOCKED),
    # which is what makes a rolling restart of it a non-event.
    build:
      context: ../..
      dockerfile: infra/docker/relay.Dockerfile
    environment:
      RABBITMQ_URL: amqp://seo:seo@rabbitmq:5672/%2F
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: on-failure

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  qdrant-data:
  meili-data:
  minio-data:
  crawl-data:
  keyword-data:
  serp-data:
  links-data:
  content-data:
  competitor-data:
  optimizer-data:
  reports-data:
