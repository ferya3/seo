# Reverse proxy for the SEO Agent dashboard.
# certbot rewrites this file to add the TLS server block and the http redirect.

# Must sit outside the server block. sites-available files are included inside
# the http context, so this is the right level.
limit_req_zone $binary_remote_addr zone=seoagent:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    # Reports can be large; a crawl of 300 pages produces a chunky JSON export.
    client_max_body_size 4m;

    # A crawl runs for minutes inside a single request when the browser polls
    # right as it finishes. Default 60s proxy timeouts cut those off.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Don't advertise the nginx version.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Slow down credential guessing against the dashboard's basic auth.
    limit_req zone=seoagent burst=20 nodelay;

    location /healthz {
        proxy_pass http://127.0.0.1:@PORT@;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # The dashboard polls for job progress; buffering adds nothing here.
        proxy_buffering off;
    }
}
