name: CI

# Everything that has been checked by hand until now, checked on every push.
#
# The project has three test suites, a type checker, a linter and a set of
# compose checks, and none of them ran unless someone remembered. That is fine
# while one person is working on it and stops being fine immediately after.
#
# Postgres is a service container rather than a mock: the store's whole value
# is that a state write and its event commit together, and a transaction
# cannot be demonstrated against a fake. The suites skip those tests when
# TEST_DATABASE_URL is unset, so a run without the database would be green and
# meaningless.

on:
  push:
    branches: ["**"]
  pull_request:

# A second push supersedes the first: nobody wants the answer for a commit
# that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python (${{ matrix.database && 'with postgres' || 'no database' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both modes, because both are supported: a single machine runs this
        # with no database at all, and that path has to keep working rather
        # than merely being skipped.
        database: [true, false]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: seo
          POSTGRES_PASSWORD: seo
          POSTGRES_DB: seo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seo -d seo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: apply the migrations
        if: matrix.database
        run: DATABASE_URL=postgresql://seo:seo@127.0.0.1:5432/seo infra/db/migrate.sh

      - name: pytest
        env:
          TEST_DATABASE_URL: ${{ matrix.database && 'postgresql://seo:seo@127.0.0.1:5432/seo' || '' }}
        run: pytest -q

      - name: ruff
        if: matrix.database
        run: ruff check services agents shared infra --exclude services/engine/.venv

      - name: every shipped module imports
        if: matrix.database
        # What the suites never load: a worker or a scheduler nobody imports
        # until a container starts.
        run: |
          python - <<'PY'
          import importlib, pathlib, sys
          sys.path[:0] = [".", "services/engine"]
          skip = {".venv", "__pycache__", "tests", "node_modules", "vendor"}
          modules = sorted({
              str(p.with_suffix("")).replace("/", ".").removesuffix(".__init__")
              for base in ("services", "agents", "shared")
              for p in pathlib.Path(base).rglob("*.py")
              if not any(part in skip for part in p.parts)
          })
          bad = []
          for name in modules:
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  bad.append(f"{name}: {type(exc).__name__}: {exc}")
          print(f"imported {len(modules) - len(bad)} modules")
          if bad:
              raise SystemExit("\n".join(bad))
          PY

  gateway:
    name: gateway
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: seo
          POSTGRES_PASSWORD: seo
          POSTGRES_DB: seo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seo -d seo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, mbstring
          coverage: none

      - name: apply the migrations
        # The gateway's tables are these migrations, not Laravel's: users,
        # tenants and projects are the ones the services hold foreign keys to.
        run: DATABASE_URL=postgresql://seo:seo@127.0.0.1:5432/seo infra/db/migrate.sh

      - name: composer install
        working-directory: apps/api-gateway
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: pint
        working-directory: apps/api-gateway
        run: ./vendor/bin/pint --test

      - name: phpunit
        working-directory: apps/api-gateway
        env:
          TEST_DATABASE_URL: postgresql://seo:seo@127.0.0.1:5432/seo
        run: php artisan test

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-dashboard/package-lock.json

      # --legacy-peer-deps is a dependency-resolution bug in npm 10.9 on the
      # Nuxt tree, not a real conflict. See the app's README.
      - run: npm ci --legacy-peer-deps

      - run: npm test
      - run: npm run typecheck
      - run: npm run build
